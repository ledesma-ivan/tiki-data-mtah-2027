name: tests
# Code and synthetic fixtures only (#54, ADR-016).
on: [push, pull_request]
permissions:
  contents: read
env:
  PYTHONUTF8: "1"
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: guard (required before the matrix)
        run: python guard.py repo
      - id: matrix
        run: |
          matrix=$(python ci_checks.py matrix)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  tests:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: 'python -m pip install --only-binary=:all: -r requirements-ci.txt'
      - run: python -VV
      - run: python -m pip freeze
      - name: pinned scorer (one code file, verified SHA-256)
        run: python ci_checks.py scorer "${{ runner.temp }}/official-scorer"
      - name: synthetic test scripts
        env:
          MTAH_OFFICIAL: ${{ runner.temp }}/official-scorer
        run: python ci_checks.py tests
      - name: synthetic pipeline and CSV
        env:
          MTAH_OFFICIAL: ${{ runner.temp }}/official-scorer
        run: python repro_check.py --metadata "${{ runner.temp }}/synthetic.json" --runner "${{ matrix.os }}"
      - uses: actions/upload-artifact@v4
        with:
          name: hash-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/synthetic.json
          if-no-files-found: error
          retention-days: 7
  same-bytes:
    needs: [prepare, tests]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: require guard and every test job to pass
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
        run: test "$PREPARE_RESULT" = success && test "$TESTS_RESULT" = success
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ fromJSON(needs.prepare.outputs.matrix).python[0] }}
      - uses: actions/download-artifact@v4
        with:
          pattern: hash-*
          path: hashes
      - name: require the complete matrix and identical CSV bytes
        run: python ci_checks.py compare hashes
